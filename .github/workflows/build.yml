name: Build Windows and macOS apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
            architecture: x64
          - runner: macos-15
            target: macos-arm64
            architecture: arm64
          - runner: macos-15-intel
            target: macos-x64
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install runtime, test and build dependencies (wheels only)
        run: python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Verify tests and build native application
        run: python scripts/build.py
      - name: Upload application ZIP and checksums
        uses: actions/upload-artifact@v5.0.0
        with:
          name: StudentCardStudio-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.sha256
            release/build-*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: verification-${{ matrix.target }}
          path: verification/
          if-no-files-found: ignore
          retention-days: 30
